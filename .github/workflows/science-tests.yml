name: Offline lunar-science regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install "pytest>=8" "numpy>=1.26" "rasterio>=1.3" "pyproj>=3.6" "matplotlib>=3.8" "pillow>=10"

      - name: Run offline solar and terrain unit tests
        working-directory: SelenEkto_Data_Infrastructure
        run: >-
          python -m pytest -q
          tests/test_candidate_solar.py
          tests/test_illumination_controls.py
          tests/test_horizon.py
          tests/test_horizons.py
          tests/test_solar.py
          tests/test_terrain_analysis.py

      - name: Confirm no NASA network calls are required
        run: echo "These selected tests use deterministic local fixtures and mocks."
