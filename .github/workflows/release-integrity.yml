name: Release integrity regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    name: Verify release packaging on Windows and Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools
        run: python -m pip install pytest

      - name: Compile source and release scripts
        working-directory: SelenEkto_Data_Infrastructure
        run: python -m compileall -q src scripts release

      - name: Run release-gate regression tests
        working-directory: SelenEkto_Data_Infrastructure
        run: python -m pytest -q tests/test_final_release_gate.py tests/test_release_privacy.py tests/test_public_profile_portability.py

      - name: Check for tracked Windows builds
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(dist|build|release_ready|\.venv)/'; then
            echo "Generated build artifacts must not be tracked."
            exit 1
          fi
