[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selenekto-data-layer"
version = "0.1.0"
description = "SelenEkto lunar south-pole scientific data catalogue, acquisition and validation tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED - project prototype" }
authors = [{ name = "SelenEkto student development team" }]
dependencies = []

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
test = ["pytest>=8"]

[project.scripts]
selenekto-data = "selenekto_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
